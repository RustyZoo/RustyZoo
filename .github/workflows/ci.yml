name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# One run per pull request or master ref: a new push cancels the one in progress. A label waits for it instead (both
# run on the same head, which would keep the cancelled jobs as failed checks).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled') }}

jobs:
  # The legs this run builds: `all` on master and on a pull request with the label `full-ci` (merge-queue
  # adds it before it waits for CI), else `linux`; `none` when a pull request changes only Markdown files
  # (but docs/usage.md, which the executable embeds) or the licence.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      workflows: ${{ steps.legs.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # HEAD is the pull request merged into master, HEAD^ is master.
      - id: legs
        env:
          FULL: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          files=$(git diff --name-only HEAD^ HEAD)
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! grep -qvxE '.*\.md|LICENSE' <<<"$files" &&
            ! grep -qx docs/usage.md <<<"$files"; then
            legs=none
          elif [ "$FULL" = true ]; then
            legs=all
          else
            legs=linux
          fi
          echo "legs=$legs" | tee -a "$GITHUB_OUTPUT"
          # A pull request that touches .github/ never reaches the self-hosted runners (see `build`).
          if grep -q '^\.github/' <<<"$files"; then workflows=true; else workflows=false; fi
          echo "workflows=$workflows" | tee -a "$GITHUB_OUTPUT"

  # The Linux leg, then the other systems (only with the legs `all`): the same job. The Linux legs of
  # `build` and `play` run on the self-hosted runners (they hold the full game installs, see the steps
  # marked self-hosted) for a push and a pull request by the maintainer from this repository, on a
  # GitHub-hosted runner for any other pull request (a fork, a Dependabot branch) and for one that changes
  # anything under .github/ (its own workflow would run on the game data before any review; the check is
  # in the job `scope`). Never `pull_request_target`: a fork's code must not meet the game data.
  build:
    name: build (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.legs != 'none'
    runs-on: &gamedata-runner ${{ ((github.event_name == 'push' && !startsWith(github.ref_name, 'dependabot/')) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'SlendyMilky' &&
      needs.scope.outputs.workflows != 'true' &&
      !startsWith(github.head_ref, 'dependabot/'))) &&
      fromJSON('["self-hosted","linux","x64","gamedata","rustyzoo"]') || matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            system: linux
            artifact: rustyzoo-linux-x86_64
            path: target/release/rustyzoo
    defaults: &bash
      run:
        shell: bash
    # The state hashes of the simulation, one output per system: a leg sets only its own, and the
    # job `hashes` compares them.
    outputs: &build-outputs
      linux: ${{ steps.simhash.outputs.linux }}
      windows: ${{ steps.simhash.outputs.windows }}
      macos: ${{ steps.simhash.outputs.macos }}
      windows32: ${{ steps.simhash.outputs.windows32 }}
      linuxarm: ${{ steps.simhash.outputs.linuxarm }}
      windowsarm: ${{ steps.simhash.outputs.windowsarm }}
    # No display, GPU or sound card on the runners: the same headless SDL settings on every OS.
    # The dummy video driver and the software renderer need no OpenGL, which the offscreen
    # video driver could not initialize on macOS. The dates use the English names whatever the
    # runner's regional settings.
    env: &headless
      SDL_VIDEO_DRIVER: dummy
      SDL_RENDER_DRIVER: software
      SDL_AUDIO_DRIVER: dummy
      RUSTYZOO_ENGLISH_DATES: 1
    steps: &build-steps
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Never the real user folder of the runner.
      - &user-folder
        name: Set the user folder
        run: echo "RUSTYZOO_USER_DIR=$RUNNER_TEMP/rustyzoo-user" >> "$GITHUB_ENV"

      # The game data never leaves the runner: nothing of it is uploaded or cached, and its folders are
      # masked in the logs (a public repository's logs are public).
      - &mask-gamedata
        name: Mask the game data folders in the logs
        if: runner.environment == 'self-hosted'
        run: |
          for path in /opt/gamedata "$ZT_DATA_DIR" "$ZT_DATA_DIR_FR"; do echo "::add-mask::$path"; done

      # The SDL3 build dependencies from SDL's docs/README-linux.md (Ubuntu 22.04+ list),
      # without the build tools the runner already has. They make SDL build its real
      # X11, Wayland, ALSA, PulseAudio and PipeWire backends.
      - &sdl-dependencies
        name: Install SDL build dependencies
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
            liburing-dev xvfb

      # Self-hosted: the image has the SDL dependencies, and /cache keeps cargo, rustup and sccache.
      - &toolchain
        name: Install the Rust toolchain from rust-toolchain.toml
        # Self-hosted: jobs share /cache/rustup, so concurrent installs are serialised.
        run: |
          lock=()
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ] && command -v flock >/dev/null; then
            lock=(flock /cache/rustup.lock)
          fi
          "${lock[@]}" rustup toolchain install --profile minimal

      # Every cargo command of the leg then builds, tests and runs for the target (SDL builds
      # the same way as on the 64-bit leg).
      - name: Add the Rust target
        if: matrix.target
        run: |
          rustup target add ${{ matrix.target }}
          echo "CARGO_BUILD_TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"

      - &cargo-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-

      # No simulation code walks a hash map (the order differs at every run).
      - if: runner.os == 'Linux'
        run: ci/check-hash-iteration.sh

      # No source file over 900 lines grows (ci/file-size-allow.txt lists today's).
      - if: runner.os == 'Linux'
        run: ci/check-file-size.sh
      - run: cargo fmt --check
      # A leg marked `smoke` only builds and runs the smoke test (no clippy, tests, trials or window).
      - if: ${{ !matrix.smoke }}
        run: cargo clippy --all-targets -- -D warnings
      - if: ${{ !matrix.smoke }}
        run: cargo test
      - run: cargo build --release

      # Self-hosted: the ignored tests on the full English and French installs (as verify-fix runs them).
      # Only the failed test names and the totals are printed: a panic message can quote a game file.
      - name: Full-game tests on the English and French installs
        if: runner.environment == 'self-hosted'
        run: |
          : "${ZT_DATA_DIR:?}" "${ZT_DATA_DIR_FR:?}"
          out="$RUNNER_TEMP/full-tests.out"
          status=0
          full() { # full <name> <install folder> <test arguments>
            name=$1 dir=$2
            shift 2
            code=0
            ZT_DATA_DIR=$dir cargo test -- "$@" >"$out" 2>&1 || code=$?
            grep -E '\.\.\. FAILED$|^test result:|^error(\[|:)' "$out" || true
            echo "$name: exit $code"
            [ "$code" = 0 ] || status=1
          }
          full full "$ZT_DATA_DIR" --include-ignored
          full full-fr "$ZT_DATA_DIR_FR" --ignored
          rm -f "$out"
          exit "$status"

      # Guards the static C runtime: SDL is built by CMake, which picks the runtime on its own.
      - name: Check that the executable does not need the Visual C++ runtime DLLs
        if: runner.os == 'Windows'
        run: |
          if grep -aqi vcruntime140 ${{ matrix.path }}; then
            echo "rustyzoo.exe still references VCRUNTIME140"
            exit 1
          fi
          echo "rustyzoo.exe does not reference VCRUNTIME140"

      # Guards against the console-build option silently producing a headless-only SDL.
      - name: Check that SDL built the desktop backends
        if: runner.os == 'Linux'
        run: |
          report=$(cat target/release/build/sdl3-sys-*/output)
          for backend in 'Video drivers:.* x11' 'Video drivers:.* wayland' 'Audio drivers:.* alsa' \
            'Audio drivers:.* pulseaudio' 'Audio drivers:.* pipewire'; do
            grep -Eq "$backend" <<<"$report" || { echo "SDL was built without: $backend"; exit 1; }
          done
          echo "$report" | grep -E '(Video|Audio) drivers:'

      - name: Smoke test
        run: cargo run --release -- window-smoke

      - name: Build the x86_64 slice and merge a universal binary
        if: matrix.system == 'macos'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/rustyzoo \
            target/release/rustyzoo target/x86_64-apple-darwin/release/rustyzoo
          lipo -info target/universal/rustyzoo

      - name: Smoke test the universal binary
        if: matrix.system == 'macos'
        run: target/universal/rustyzoo window-smoke

      # The two free official trials from Microsoft, extracted outside the checkout. Only the
      # extracted folders are cached; neither they nor the downloads are uploaded below. The
      # window screenshot step further down checks one picture of a map and publishes none.
      # Self-hosted: no cache, the script downloads them.
      - &trials-cache
        if: runner.environment == 'github-hosted' && !matrix.smoke
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/trials/base-trial
            ${{ runner.temp }}/trials/expansion-trial
          key: trials-${{ runner.os }}-${{ hashFiles('ci/fetch-trials.sh') }}

      # On a cache hit the script finds the folders and does nothing. When Microsoft's download
      # is unavailable (status 3) the step warns and passes; any other failure fails it.
      - name: Run the asset commands on the official trials
        if: ${{ !matrix.smoke }}
        run: |
          trials="${RUNNER_TEMP//\\//}/trials"
          status=0
          ci/fetch-trials.sh "$trials" || status=$?
          if [ "$status" = 3 ]; then
            rm -rf "$trials"
            echo "::warning title=Trials skipped::A trial download was unavailable, so the asset commands did not run on real game data."
            exit 0
          fi
          [ "$status" = 0 ] || exit "$status"
          ci/check-trials.sh ${{ matrix.path }} "$trials"

      # The state hash of 1000 simulation steps of every map of the trials, with steps of 67 ms and
      # of 1000 ms (two month changes), kept as a job output (nothing is uploaded) for the job
      # `hashes`.
      - name: State hash of the simulation
        id: simhash
        if: ${{ !matrix.smoke }}
        run: |
          trials="${RUNNER_TEMP//\\//}/trials"
          if [ ! -d "$trials/base-trial" ] || [ ! -d "$trials/expansion-trial" ]; then
            echo "::warning title=Simulation hash skipped::No trial data on this runner."
            exit 0
          fi
          hashes=$(ci/sim-hash.sh ${{ matrix.path }} "$trials")
          echo "$hashes"
          if grep -q '=failed$' <<<"$hashes"; then
            echo "::warning title=Simulation hash::A map did not run."
          fi
          echo "${{ matrix.system }}=$(echo "$hashes" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # One picture per system from the platform's real video driver and window server (X11
      # on a virtual display for Linux). The log gets the game size and factor, the three sizes,
      # the display scale, the number of colours and the hash of the pixels read back; the step
      # fails only if the mode breaks or the picture is blank. The runners have no GPU, so the software renderer draws.
      # The picture is rendered game data: it is deleted with the runner and never uploaded.
      - name: Check a window on the real video driver
        if: ${{ !matrix.smoke }}
        env:
          SDL_VIDEO_DRIVER: ${{ runner.os == 'Linux' && 'x11' || runner.os == 'macOS' && 'cocoa' || 'windows' }}
        run: |
          trials="${RUNNER_TEMP//\\//}/trials"
          if [ ! -d "$trials/base-trial" ]; then
            echo "::warning title=Window check skipped::No trial data on this runner."
            exit 0
          fi
          pre=()
          if [ "$RUNNER_OS" = Linux ]; then
            pre=(xvfb-run -a -s "-screen 0 1280x1024x24")
          fi
          tmp="${RUNNER_TEMP//\\//}"
          # The shipped ini starts the run in full screen; the picture read back must be the game's.
          mkdir -p "$RUSTYZOO_USER_DIR"
          printf '[user]\nfullscreen=0\n' >"$RUSTYZOO_USER_DIR/zoo.ini"
          "${pre[@]}" ${{ matrix.path }} --data "$trials/base-trial" run maps/default.zoo \
            --passes 60 --log "$tmp/window.log" --shot "$tmp/window.png" | tee "$tmp/window.out"
          # At factor 1 (a runner without display scaling) the pixels read back are the last
          # frame painted.
          if grep -q '^game .* factor 1$' "$tmp/window.out"; then
            last=$(awk '$4 == "draw" && $5 != "-" { h = $5 } END { print h }' "$tmp/window.log")
            grep -q "hash $last\$" "$tmp/window.out" || { echo "the picture read back is not the last frame painted ($last)"; exit 1; }
          fi

      # Self-hosted: no upload (the egress proxy blocks the artifact storage, and nothing downloads it).
      - if: runner.environment == 'github-hosted'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  build-full:
    name: build (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.legs == 'all'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            system: windows
            artifact: rustyzoo-windows-x86_64
            path: target/release/rustyzoo.exe
          # 32-bit: a pointer-width bug (the many `as usize` / `as u32` casts) would go unseen
          # otherwise. The runner is 64-bit Windows, which runs the 32-bit executables.
          - os: windows-2025
            system: windows32
            target: i686-pc-windows-msvc
            artifact: rustyzoo-windows-i686
            path: target/i686-pc-windows-msvc/release/rustyzoo.exe
          - os: macos-15
            system: macos
            artifact: rustyzoo-macos-universal
            path: target/universal/rustyzoo
          # The ARM legs: the simulation must give the same hashes there (job `hashes`).
          - os: ubuntu-24.04-arm
            system: linuxarm
            artifact: rustyzoo-linux-aarch64
            path: target/release/rustyzoo
          - os: windows-11-arm
            system: windowsarm
            artifact: rustyzoo-windows-aarch64
            path: target/release/rustyzoo.exe
          # Intel macOS: 2.3 times slower than macos-15, so only the build and the smoke test.
          - os: macos-15-intel
            system: macosintel
            smoke: true
            artifact: rustyzoo-macos-x86_64
            path: target/release/rustyzoo
    defaults: *bash
    outputs: *build-outputs
    env: *headless
    steps: *build-steps

  # The two games of the exit test of milestone M6, played by script (docs/playing.md) on the real data,
  # beside the build: each twice at the same time, the freeform game of the base trial to the
  # thirteenth month and the tank of the expansion trial for three months (about eight and two
  # minutes). The last frame and state hashes of each game are kept as a job output (nothing is
  # uploaded) for the job `hashes`.
  play:
    name: play (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.legs != 'none'
    runs-on: *gamedata-runner
    # Self-hosted, it also plays the freeform game (about 8 min) and the scenario sweep (about 11 min) of two
    # installs, side by side: with the build and the trials, 45 left under 30% of margin.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            system: linux
            bin: target/release/rustyzoo
    defaults: *bash
    outputs: &play-outputs
      linux: ${{ steps.play.outputs.linux }}
      windows: ${{ steps.play.outputs.windows }}
      macos: ${{ steps.play.outputs.macos }}
      linuxarm: ${{ steps.play.outputs.linuxarm }}
      windowsarm: ${{ steps.play.outputs.windowsarm }}
    env: *headless
    steps: &play-steps
      - *checkout
      - *user-folder
      - *mask-gamedata
      - *sdl-dependencies
      - *toolchain
      - *cargo-cache
      - run: cargo build --release
      - *trials-cache

      - name: Fetch the official trials
        run: |
          trials="${RUNNER_TEMP//\\//}/trials"
          status=0
          ci/fetch-trials.sh "$trials" || status=$?
          if [ "$status" = 3 ]; then
            rm -rf "$trials"
            echo "::warning title=Trials skipped::A trial download was unavailable, so the games were not played."
            exit 0
          fi
          exit "$status"

      - name: Play the freeform and tank games
        id: play
        run: |
          trials="${RUNNER_TEMP//\\//}/trials"
          if [ ! -d "$trials/base-trial" ] || [ ! -d "$trials/expansion-trial" ]; then
            echo "::warning title=Games skipped::No trial data on this runner."
            exit 0
          fi
          status=0
          ci/check-playable.sh ${{ matrix.bin }} "$trials/base-trial" ci/playable.txt | tee "$RUNNER_TEMP/play.out" || status=1
          ci/check-playable.sh ${{ matrix.bin }} "$trials/expansion-trial" ci/playable-tank.txt | tee -a "$RUNNER_TEMP/play.out" || status=1
          hashes=$(sed -n 's/^ok: \([^:]*\): two runs .*, last frame \([0-9a-f]*\), last state \([0-9a-f]*\)$/\1=\2,\3/p' "$RUNNER_TEMP/play.out" | tr '\n' ' ')
          echo "${{ matrix.system }}=$hashes" >> "$GITHUB_OUTPUT"
          set -- $hashes
          if [ $# != 2 ]; then
            echo "::error title=Games played::The hashes of both games were not read from the ok: lines: '$hashes'"
            status=1
          fi
          exit "$status"

      # Every scenario and map of the trials plays a month, and a made-up scenario is won and another lost
      # (about two minutes on the self-hosted runner). Linux only: the checks read the same log on every system.
      - name: Play the scenarios of the trials and win and lose one
        if: runner.os == 'Linux'
        run: |
          trials="${RUNNER_TEMP//\\//}/trials"
          if [ ! -d "$trials/base-trial" ] || [ ! -d "$trials/expansion-trial" ]; then
            echo "::warning title=Scenarios skipped::No trial data on this runner."
            exit 0
          fi
          status=0
          for trial in base-trial expansion-trial; do
            ci/check-scenarios.sh ${{ matrix.bin }} "$trials/$trial" || status=1
            ci/check-ends.sh ${{ matrix.bin }} "$trials/$trial" || status=1
          done
          exit "$status"

      # Self-hosted: the freeform game of ci/playable-full.txt on the full English and French installs
      # (as verify-fix plays it), side by side. Only the status lines are printed.
      - name: Play the freeform game on the English and French installs
        if: runner.environment == 'self-hosted'
        run: |
          : "${ZT_DATA_DIR:?}" "${ZT_DATA_DIR_FR:?}"
          for v in ZT_DATA_DIR ZT_DATA_DIR_FR; do
            (ci/check-playable.sh ${{ matrix.bin }} "${!v}" ci/playable-full.txt >"$RUNNER_TEMP/$v.out" 2>&1 &&
              echo 0 || echo $?) >"$RUNNER_TEMP/$v.status" &
          done
          wait
          status=0
          for v in ZT_DATA_DIR ZT_DATA_DIR_FR; do
            echo "$v:"
            grep -E '^(ok|skipped|pending|FAILED):' "$RUNNER_TEMP/$v.out" | cut -c1-300 || true
            [ "$(cat "$RUNNER_TEMP/$v.status")" = 0 ] || status=1
          done
          rm -f "$RUNNER_TEMP"/ZT_DATA_DIR*.out
          exit "$status"

      # Self-hosted: every scenario and map of the full English and French installs plays a month (eight at a
      # time, side by side), and the made-up win and loss and the third scenario's loss end as they should.
      # Only the status lines are printed.
      - name: Play the scenarios of the English and French installs
        if: runner.environment == 'self-hosted'
        run: |
          : "${ZT_DATA_DIR:?}" "${ZT_DATA_DIR_FR:?}"
          for v in ZT_DATA_DIR ZT_DATA_DIR_FR; do
            (SCENARIO_JOBS=6 ci/check-scenarios.sh ${{ matrix.bin }} "${!v}" >"$RUNNER_TEMP/$v.out" 2>&1
              swept=$?
              ci/check-ends.sh ${{ matrix.bin }} "${!v}" >>"$RUNNER_TEMP/$v.out" 2>&1
              echo $((swept | $?))) >"$RUNNER_TEMP/$v.status" &
          done
          wait
          status=0
          for v in ZT_DATA_DIR ZT_DATA_DIR_FR; do
            echo "$v:"
            grep -E '^(ok|FAILED):' "$RUNNER_TEMP/$v.out" | cut -c1-300 || true
            [ "$(cat "$RUNNER_TEMP/$v.status")" = 0 ] || status=1
          done
          rm -f "$RUNNER_TEMP"/ZT_DATA_DIR*.out "$RUNNER_TEMP"/ZT_DATA_DIR*.status
          exit "$status"

  play-full:
    name: play (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.legs == 'all'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            system: windows
            bin: target/release/rustyzoo.exe
          - os: macos-15
            system: macos
            bin: target/release/rustyzoo
          - os: ubuntu-24.04-arm
            system: linuxarm
            bin: target/release/rustyzoo
          - os: windows-11-arm
            system: windowsarm
            bin: target/release/rustyzoo.exe
    defaults: *bash
    outputs: *play-outputs
    env: *headless
    steps: *play-steps

  # The simulation is deterministic: the state hash of every map of the trials after 1000 steps (short
  # and long) is the same on the three systems, on 32-bit Windows and on ARM Linux and Windows, and no map
  # fails to run; so are the last frame and state hashes of each played game. A system without trial data is skipped with a warning. Only with the
  # legs `all` (skipped with the legs it needs).
  hashes:
    name: hashes
    needs: [build, build-full, play, play-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LINUX: ${{ needs.build.outputs.linux }}
      WINDOWS: ${{ needs.build-full.outputs.windows }}
      MACOS: ${{ needs.build-full.outputs.macos }}
      WINDOWS32: ${{ needs.build-full.outputs.windows32 }}
      LINUXARM: ${{ needs.build-full.outputs.linuxarm }}
      WINDOWSARM: ${{ needs.build-full.outputs.windowsarm }}
      PLAY_LINUX: ${{ needs.play.outputs.linux }}
      PLAY_WINDOWS: ${{ needs.play-full.outputs.windows }}
      PLAY_MACOS: ${{ needs.play-full.outputs.macos }}
      PLAY_LINUXARM: ${{ needs.play-full.outputs.linuxarm }}
      PLAY_WINDOWSARM: ${{ needs.play-full.outputs.windowsarm }}
    steps:
      - run: |
          failed=0
          same() { # same <what> <system>:<hashes>...
            echo "$1"
            seen=0 first= differ=0
            for arg in "${@:2}"; do
              hashes=${arg#*:}
              printf '  %-12s %s\n' "${arg%%:*}:" "$hashes"
              [ -n "$hashes" ] || continue
              seen=$((seen + 1))
              [ "$hashes" = "${first:=$hashes}" ] || differ=1
            done
            if [ "$differ" = 1 ]; then
              echo "the $1 differ between systems"
              failed=1
            elif [ "$seen" -lt "$(($# - 1))" ]; then
              echo "::warning title=$1::Only $seen of $(($# - 1)) systems had trial data, so the hashes were not all compared."
            fi
          }
          same "state hashes of the simulation" "linux:$LINUX" "windows:$WINDOWS" "macos:$MACOS" \
            "win32:$WINDOWS32" "linux-arm:$LINUXARM" "windows-arm:$WINDOWSARM"
          case "$LINUX$WINDOWS$MACOS$WINDOWS32$LINUXARM$WINDOWSARM" in
            *=failed*)
              echo "a map did not run"
              failed=1
              ;;
          esac
          same "hashes of the played games" "linux:$PLAY_LINUX" "windows:$PLAY_WINDOWS" "macos:$PLAY_MACOS" \
            "linux-arm:$PLAY_LINUXARM" "windows-arm:$PLAY_WINDOWSARM"
          exit "$failed"

  # The single required status check: fails unless `scope` succeeded and every other job succeeded or was
  # skipped. A job is skipped only when `scope` left its legs out, or after a job it needs failed (and then
  # that one fails this check). A pull request is merged only after a run with the legs `all` (merge-queue).
  ci:
    name: ci
    needs: [scope, build, build-full, play, play-full, hashes]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          test "${{ needs.scope.result }}" = success || exit 1
          for result in ${{ join(needs.*.result, ' ') }}; do
            case $result in success | skipped) ;; *) exit 1 ;; esac
          done
