name: Release

# Builds the package of every system as workflow artefacts (on Linux a tarball and an AppImage).
# A package job publishes nothing. On a tag the last job (feed) signs the update feed and uploads it
# with the update files to the release of the tag (see CONTRIBUTING.md). No game or trial data goes
# into a package.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: the glibc baseline of the Linux builds.
          - os: ubuntu-22.04
            system: linux
            arch: x86_64
            bin: target/release/rustyzoo
          - os: ubuntu-22.04-arm
            system: linux
            arch: aarch64
            bin: target/release/rustyzoo
          - os: windows-2025
            system: windows
            arch: x86_64
            bin: target/release/rustyzoo.exe
          - os: windows-11-arm
            system: windows
            arch: aarch64
            bin: target/release/rustyzoo.exe
          - os: macos-15
            system: macos
            arch: universal
            bin: target/universal/rustyzoo
            # Both slices target macOS 11, the first one of Apple silicon; Info.plist says the same.
            deployment: '11.0'
    defaults:
      run:
        shell: bash
    # The headless SDL settings of ci.yml for the smoke test.
    env:
      SDL_VIDEO_DRIVER: dummy
      SDL_RENDER_DRIVER: software
      SDL_AUDIO_DRIVER: dummy
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
      # Where the opt-in crash reports and start statistics go. Public by design: they ship in the
      # binary, which asks the player before it sends anything.
      RUSTYZOO_CRASH_DSN: https://a5eb34b863e146f89e6ff00876987801@errors.rustyzoo.com/1
      RUSTYZOO_STATS_URL: https://pulse.rustyzoo.com
      RUSTYZOO_STATS_WEBSITE: 0b0d4d11-b924-4a34-b5ff-7bfe52663dd4
      # The public key of the update feed (a repository variable, not a secret). Unset: the build never updates.
      RUSTYZOO_UPDATE_KEY: ${{ vars.RUSTYZOO_UPDATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On a tag, the tag must be v + the crate version.
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "no version in Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error title=Tag::the tag $GITHUB_REF_NAME is not v$version (Cargo.toml)"
            exit 1
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          echo "RUSTYZOO_USER_DIR=$RUNNER_TEMP/rustyzoo-user" >> "$GITHUB_ENV"

      # The SDL build dependencies of ci.yml (SDL's docs/README-linux.md): SDL builds its real X11,
      # Wayland, ALSA, PulseAudio and PipeWire backends.
      - name: Install SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
            liburing-dev desktop-file-utils appstream

      # No cache: a release builds from scratch.
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install --profile minimal

      # The notices of the crates compiled into the program (about.toml accepts the licences of
      # deny.toml). It fails on a licence outside that list; the packages below copy the file, so
      # none ships without it.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-about@0.9.3
      - name: Generate the third-party notices
        run: |
          cargo fetch --locked
          mkdir -p target
          cargo about generate --offline --locked -o target/THIRD-PARTY-NOTICES.txt packaging/notices/about.hbs
          [ -s target/THIRD-PARTY-NOTICES.txt ]

      - run: cargo build --release
      - run: cargo run --release -- window-smoke

      - name: Build the x86_64 slice and merge a universal binary
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/rustyzoo \
            target/release/rustyzoo target/x86_64-apple-darwin/release/rustyzoo
          lipo -info target/universal/rustyzoo
          target/universal/rustyzoo window-smoke

      # Signing happens only when all six secrets exist (not on forks, not before they are added);
      # otherwise RustyZoo.app keeps the ad-hoc seal of bundle.sh.
      - name: Check the signing secrets
        id: sign
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_CERT_PASSWORD" ] && [ -n "$APPLE_API_KEY_P8" ] \
            && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=macOS signing::secrets missing, RustyZoo.app is sealed ad hoc"
          fi

      # A keychain made for this job holds the Developer ID certificate; the next steps delete it.
      - name: Import the Developer ID certificate
        id: keychain
        if: steps.sign.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          kc=$RUNNER_TEMP/rustyzoo-sign.keychain-db
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          pw=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | sed -n "s/^ *[0-9]*) \([0-9A-F]\{40\}\) \"Developer ID Application:.*($APPLE_TEAM_ID)\"\$/\1/p" | head -n 1)
          [ -n "$id" ] || { echo "::error title=Signing::no Developer ID Application identity for the team"; exit 1; }
          echo "identity=$id" >> "$GITHUB_OUTPUT"

      # RustyZoo.app: the binary, Info.plist and the icon, signed with the identity above (hardened
      # runtime), or sealed ad hoc without it. window-smoke runs on the signed app.
      - name: Build RustyZoo.app
        if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          packaging/macos/bundle.sh target/universal/rustyzoo "${{ steps.version.outputs.version }}" "$MACOSX_DEPLOYMENT_TARGET" target/app "${IDENTITY:--}"
          target/app/RustyZoo.app/Contents/MacOS/rustyzoo window-smoke

      # Apple checks the zip, then the ticket is stapled into RustyZoo.app, so Package zips the
      # stapled app (the ticket travels in the bundle) and Gatekeeper accepts it offline.
      - name: Notarise and staple RustyZoo.app
        if: steps.sign.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          umask 077
          key=$RUNNER_TEMP/AuthKey.p8
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          app=target/app/RustyZoo.app
          ditto -c -k --keepParent "$app" target/notarize.zip
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          # A failed submission still prints its JSON: keep it, print it, decide on the status only.
          xcrun notarytool submit target/notarize.zip "${auth[@]}" --wait --output-format json > target/notarize.json || true
          cat target/notarize.json
          status=$(jq -r '.status // empty' target/notarize.json || true)
          id=$(jq -r '.id // empty' target/notarize.json || true)
          if [ "$status" != Accepted ]; then
            if [ -n "$id" ]; then xcrun notarytool log "$id" "${auth[@]}" || true; fi
            echo "::error title=Notarisation::Apple did not accept RustyZoo.app"
            exit 1
          fi
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -vv -t exec "$app"

      - name: Delete the keychain
        if: always() && steps.keychain.outcome != 'skipped'
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

      # The executable (on macOS RustyZoo.app), the licences (with the third-party notices) and where its source is. CMake (which
      # builds SDL) writes the archive and the checksum the same way on every system.
      - name: Package
        id: package
        env:
          NAME: rustyzoo-${{ steps.version.outputs.version }}-${{ matrix.system }}-${{ matrix.arch }}
        run: |
          mkdir -p "dist/$NAME/vendor/nihav" "dist/$NAME/fonts"
          if [ "$RUNNER_OS" = macOS ]; then
            ditto target/app/RustyZoo.app "dist/$NAME/RustyZoo.app"
            cp LICENSE "dist/$NAME/"
          else
            cp ${{ matrix.bin }} LICENSE "dist/$NAME/"
          fi
          cp target/THIRD-PARTY-NOTICES.txt "dist/$NAME/"
          # The same files as packaging/linux/appimage.sh (its licence block): keep both lists equal.
          cp vendor/nihav/COPYING "dist/$NAME/vendor/nihav/"
          cp fonts/OFL.txt "dist/$NAME/fonts/"
          echo "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA" > "dist/$NAME/SOURCE.txt"
          cd dist
          if [ "$RUNNER_OS" = Linux ]; then
            archive=$NAME.tar.gz
            cmake -E tar czf "$archive" "$NAME"
          elif [ "$RUNNER_OS" = macOS ]; then
            archive=$NAME.zip
            ditto -c -k --keepParent "$NAME" "$archive"
          else
            archive=$NAME.zip
            cmake -E tar cf "$archive" --format=zip "$NAME"
          fi
          cmake -E sha256sum "$archive" | tee "$archive.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "files=dist/$archive" >> "$GITHUB_OUTPUT"

      # The AppImage of packaging/linux (pinned appimagetool and runtime), run without FUSE for the
      # window smoke test, then checksummed beside the tarball.
      - name: Build the AppImage
        if: runner.os == 'Linux'
        run: |
          packaging/linux/appimage.sh ${{ matrix.bin }} "${{ steps.version.outputs.version }}" target/appimage
          image=target/appimage/RustyZoo-${{ steps.version.outputs.version }}-${{ matrix.arch }}.AppImage
          "$image" --appimage-extract-and-run window-smoke
          cp "$image" dist/
          cd dist
          cmake -E sha256sum "$(basename "$image")" | tee "$(basename "$image").sha256"

      # What an update replaces the install with: the bare executable on Windows, a zip of the app on
      # macOS (the AppImage above on Linux).
      - name: Update file
        if: runner.os != 'Linux'
        run: |
          v="${{ steps.version.outputs.version }}"
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k --keepParent target/app/RustyZoo.app "dist/RustyZoo-$v-macos.app.zip"
          else
            cp ${{ matrix.bin }} "dist/rustyzoo-$v-windows-${{ matrix.arch }}.exe"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.files }}
            ${{ steps.package.outputs.files }}.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.exe
            dist/*.app.zip
          if-no-files-found: error

  # Only on a tag. Without the repository variable RUSTYZOO_UPDATE_KEY or the secret RUSTYZOO_FEED_KEY
  # (the PEM private key) it signs nothing and ends green. The release is made as a draft when the
  # tag has none; the owner publishes it.
  feed:
    name: update feed
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_KEY: ${{ vars.RUSTYZOO_UPDATE_KEY }}
      FEED_KEY: ${{ secrets.RUSTYZOO_FEED_KEY }}
    steps:
      - name: Sign and upload the feed
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$UPDATE_KEY" ] || [ -z "$FEED_KEY" ]; then
            echo "::warning title=Update feed::RUSTYZOO_UPDATE_KEY or RUSTYZOO_FEED_KEY is not set, nothing is signed"
            exit 0
          fi
          tag=$GITHUB_REF_NAME
          v=${tag#v}
          work=$RUNNER_TEMP/feed
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work"
          cd "$work"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir art
          url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag
          # <os>-<arch> of Rust -> update file; macOS is one universal app for both.
          files=()
          jq_files='{}'
          while read -r key name; do
            f=$(ls art/*/"$name")
            files+=("$f")
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            jq_files=$(jq -c --arg k "$key" --arg u "$url/$name" --arg s "$sum" '.[$k] = {url: $u, sha256: $s}' <<< "$jq_files")
          done <<EOF
          linux-x86_64 RustyZoo-$v-x86_64.AppImage
          linux-aarch64 RustyZoo-$v-aarch64.AppImage
          windows-x86_64 rustyzoo-$v-windows-x86_64.exe
          windows-aarch64 rustyzoo-$v-windows-aarch64.exe
          macos-aarch64 RustyZoo-$v-macos.app.zip
          macos-x86_64 RustyZoo-$v-macos.app.zip
          EOF
          jq -cj -n --arg v "$v" --argjson f "$jq_files" '{version: $v, files: $f}' > feed.json
          printf '%s' "$FEED_KEY" > key.pem
          openssl pkeyutl -sign -inkey key.pem -rawin -in feed.json -out feed.sig
          rm -f key.pem
          # Verify against the public key the binaries carry (raw 32 bytes in a SubjectPublicKeyInfo).
          { printf '%s' 302a300506032b6570032100 "$UPDATE_KEY"; } | xxd -r -p > pub.der
          [ "$(stat -c %s feed.sig)" = 64 ] || { echo "::error title=Update feed::bad signature size"; exit 1; }
          openssl pkeyutl -verify -pubin -inkey pub.der -keyform DER -rawin -in feed.json -sigfile feed.sig \
            || { echo "::error title=Update feed::the signature does not match RUSTYZOO_UPDATE_KEY"; exit 1; }
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$tag" --notes ""
          mapfile -t files < <(printf '%s\n' "${files[@]}" | sort -u)
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}" feed.json feed.sig
