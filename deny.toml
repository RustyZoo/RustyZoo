[graph]
all-features = true

[licenses]
# GPL: the root crate. AGPL: the vendored nihav crates and the root crate (its licence is GPL AND AGPL).
# IJG: jpeg-encoder (its licence is (MIT OR Apache-2.0) AND IJG, for the standard JPEG tables).
# ISC: ring, rustls-webpki, untrusted. CDLA-Permissive-2.0: webpki-roots (the root certificates of the HTTPS client).
allow = ["GPL-3.0-or-later", "AGPL-3.0-or-later", "MIT", "Apache-2.0", "BSD-3-Clause", "Zlib", "IJG", "Unicode-3.0", "ISC", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = []
