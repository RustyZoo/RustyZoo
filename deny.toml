[graph]
all-features = true

[licenses]
# The project's own licences (workspace crate and vendored nihav) plus what the tree uses.
allow = ["GPL-3.0-or-later", "AGPL-3.0-or-later", "MIT", "Apache-2.0", "BSD-3-Clause", "Zlib"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
